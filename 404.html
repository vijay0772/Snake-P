<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Vijay Bharvad</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/snake.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100svh;display:grid;place-items:center;background:oklch(0.15 0.006 160);color:oklch(0.97 0.004 160);font-family:'Space Grotesk',system-ui,sans-serif;text-align:center;padding:24px}
  .code{font-size:clamp(5rem,20vw,10rem);font-weight:700;letter-spacing:-0.05em;line-height:1;color:oklch(0.87 0.21 140)}
  p{margin:18px 0 30px;color:oklch(0.66 0.012 160);font-size:1.05rem}
  a{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:12px;background:oklch(0.87 0.21 140);color:oklch(0.17 0.03 150);font-weight:600;text-decoration:none}
  img{width:64px;height:64px;margin:0 auto 18px;filter:invert(78%) sepia(61%) saturate(1400%) hue-rotate(72deg) brightness(105%)}
  .mono{font-family:'JetBrains Mono',monospace}
</style>
</head>
<body>
<main>
  <img src="/snake.png" alt="">
  <div class="code">404</div>
  <p class="mono">This page slithered away.</p>
  <a href="/">Back to home →</a>
</main>
</body>
